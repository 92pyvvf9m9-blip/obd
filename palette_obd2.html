<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パレットSW OBD2モニター</title>
<style>
:root{--bg:#0b0d10;--panel:#14181d;--line:#232a32;--text:#e8edf2;--dim:#8894a0;--accent:#ffb020;--ok:#3ddc97;--bad:#ff5a5a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans",sans-serif;
 padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 24px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:15px;letter-spacing:.15em;margin:0;color:var(--accent)}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--dim)}
.pill.on{background:rgba(61,220,151,.15);color:var(--ok)}
.pill.err{background:rgba(255,90,90,.15);color:var(--bad)}
.warn{background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.4);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:12px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:13px 6px;font-size:14px;font-weight:600}
button.primary{background:var(--accent);color:#111;border:none}
button:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile.big{grid-column:span 1}
.lbl{font-size:11px;color:var(--dim)}
.val{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.val small{font-size:12px;color:var(--dim);font-weight:500;margin-left:3px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.tile.na{opacity:.35}
#dtcOut{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;margin-top:4px;line-height:1.7}
#dtcOut:empty{display:none}
.code{display:inline-block;background:rgba(255,90,90,.15);color:var(--bad);padding:2px 8px;border-radius:6px;margin:2px 4px 2px 0;font-weight:700}
details{margin-top:14px;font-size:12px;color:var(--dim)}
pre{white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;background:#07090b;padding:8px;border-radius:8px}
.note{font-size:11px;color:var(--dim);line-height:1.6;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--ok);color:#06140d;padding:10px 16px;border-radius:99px;font-weight:700;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
#meta{font-size:12px;color:var(--dim);margin:2px 0 8px}
</style>
</head>
<body>
<header><h1>PALETTE SW · OBD2</h1><span id="status" class="pill">未接続</span></header>

<div id="warn" class="warn" hidden>
このブラウザはBluetoothに対応していません。<br>
iPhoneの場合は App Store の無料ブラウザ「<b>Bluefy</b>」でこのページを開いてください（Safari・Chromeでは接続できません）。<br>
「デモ」ボタンで画面の動きだけは確認できます。
</div>

<div class="btns">
 <button id="btnConnect" class="primary">接続</button>
 <button id="btnDemo">デモ</button>
 <button id="btnStop" disabled>停止</button>
</div>
<div id="meta"></div>

<div class="grid" id="grid"></div>

<div class="btns">
 <button id="btnDtc" disabled>故障コード</button>
 <button id="btnCopy" class="primary">Claude用コピー</button>
 <button id="btnCsv">CSVコピー</button>
</div>
<div id="dtcOut"></div>

<details><summary>通信ログ（うまく動かない時に）</summary><pre id="log"></pre></details>

<p class="note">
・運転中は画面を操作しないでください。走行データは同乗者が操作するか、停車後に確認を。<br>
・「Claude用コピー」を押して、Claudeのチャットに貼り付けると、データを読んで解説できます。<br>
・故障コードの読取のみ行います（消去はしません）。
</p>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ===== 表示する項目（OBD2 標準PID / モード01） =====
const PIDS = [
 {id:'0C', key:'rpm',      label:'エンジン回転数', unit:'rpm',  f:(a,b)=>(a*256+b)/4, dp:0, max:7000},
 {id:'0D', key:'speed',    label:'車速',          unit:'km/h', f:a=>a,             dp:0, max:140},
 {id:'05', key:'coolant',  label:'水温',          unit:'℃',   f:a=>a-40,          dp:0, max:120},
 {id:'0F', key:'iat',      label:'吸気温',        unit:'℃',   f:a=>a-40,          dp:0, max:80},
 {id:'04', key:'load',     label:'エンジン負荷',   unit:'%',    f:a=>a*100/255,     dp:0, max:100},
 {id:'11', key:'throttle', label:'スロットル開度', unit:'%',    f:a=>a*100/255,     dp:0, max:100},
 {id:'0B', key:'map',      label:'吸気管圧力',     unit:'kPa',  f:a=>a,             dp:0, max:200},
 {id:'06', key:'stft',     label:'燃調 短期',     unit:'%',    f:a=>(a-128)*100/128, dp:1},
 {id:'07', key:'ltft',     label:'燃調 長期',     unit:'%',    f:a=>(a-128)*100/128, dp:1},
];
const VOLT = {key:'volt', label:'バッテリー電圧', unit:'V', dp:1, max:15};
const ALL = [...PIDS, VOLT];

// よく使われるBLE版ELM327のサービスUUID
const SERVICES = [
 '0000fff0-0000-1000-8000-00805f9b34fb',
 '0000ffe0-0000-1000-8000-00805f9b34fb',
 '000018f0-0000-1000-8000-00805f9b34fb',
 'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
 '0000ae30-0000-1000-8000-00805f9b34fb',
 '0000ffb0-0000-1000-8000-00805f9b34fb',
];

const $ = id => document.getElementById(id);
let transport = null, running = false, isCAN = true, protocol = '';
let supported = new Set(PIDS.map(p=>p.id));
let samples = [], latest = {}, lastDtc = null, startTime = null;

// ===== 画面 =====
function buildGrid(){
 $('grid').innerHTML = ALL.map(p=>`
  <div class="tile" id="t_${p.key}">
   <div class="lbl">${p.label}</div>
   <div class="val"><span id="v_${p.key}">--</span><small>${p.unit}</small></div>
   ${p.max?`<div class="bar"><i id="b_${p.key}"></i></div>`:''}
  </div>`).join('');
}
function show(p, v){
 latest[p.key] = v;
 $('v_'+p.key).textContent = v==null ? '--' : v.toFixed(p.dp);
 if(p.max && $('b_'+p.key)) $('b_'+p.key).style.width = v==null?0:Math.max(0,Math.min(100,v/p.max*100))+'%';
}
function setStatus(t, cls){ const s=$('status'); s.textContent=t; s.className='pill '+(cls||''); }
function log(t){ const l=$('log'); l.textContent += t+'\n'; if(l.textContent.length>20000) l.textContent=l.textContent.slice(-15000); l.scrollTop=l.scrollHeight; }
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1800); }

// ===== ELM327 との通信 =====
let rxBuf = '', pending = null, chain = Promise.resolve();
function onData(text){
 rxBuf += text;
 const i = rxBuf.indexOf('>');
 if(i >= 0){
  const resp = rxBuf.slice(0,i); rxBuf = rxBuf.slice(i+1);
  if(pending){ const p=pending; pending=null; clearTimeout(p.timer); p.resolve(resp); }
 }
}
function cmd(c, timeout=4000){
 const run = () => new Promise(resolve=>{
  rxBuf = '';
  pending = {resolve, timer:setTimeout(()=>{ pending=null; resolve('TIMEOUT'); }, timeout)};
  log('→ '+c);
  transport.write(c+'\r').catch(e=>{ log('送信エラー '+e); });
 }).then(r=>{ log('← '+r.replace(/[\r\n]+/g,' ').trim()); return r; });
 chain = chain.then(run, run);
 return chain;
}
// 応答の掃除（複数フレームの "0:" などを除去）
function lines(r){
 return r.split(/[\r\n]+/).map(l=>l.trim().replace(/\s+/g,'').toUpperCase())
  .filter(l=>l && !/^(SEARCHING|BUSINIT|OK|\.\.\.)/.test(l) && !/^[0-9A-F]{3}$/.test(l))
  .map(l=>l.replace(/^[0-9A-F]:/,''));
}
function parsePid(r, pid){
 for(const l of lines(r)){
  const i = l.indexOf('41'+pid);
  if(i>=0){
   const hex = l.slice(i+4); const b=[];
   for(let k=0;k+2<=hex.length;k+=2) b.push(parseInt(hex.slice(k,k+2),16));
   if(b.length && !b.some(isNaN)) return b;
  }
 }
 return null;
}
function decodeDtc(c){
 const n = parseInt(c[0],16);
 return 'PCBU'[n>>2] + (n&3) + c.slice(1);
}
function parseDtc(r){
 const ls = lines(r);
 if(ls.some(l=>l.includes('NODATA'))) return [];
 let body = '';
 if(isCAN){
  const s = ls.join(''); const i = s.indexOf('43');
  if(i<0) return null;
  body = s.slice(i+4); // "43" + 件数バイト を飛ばす
 } else {
  for(const l of ls) if(l.startsWith('43')) body += l.slice(2);
  if(!body) return null;
 }
 const out = [];
 for(let k=0;k+4<=body.length;k+=4){ const c=body.slice(k,k+4); if(c!=='0000' && /^[0-9A-F]{4}$/.test(c)) out.push(decodeDtc(c)); }
 return [...new Set(out)];
}

// ===== Bluetooth (BLE) 接続 =====
async function bleTransport(){
 const device = await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices:SERVICES});
 setStatus('接続中…');
 const server = await device.gatt.connect();
 let nChar=null, wChar=null;
 for(const u of SERVICES){
  let svc; try{ svc = await server.getPrimaryService(u); }catch(e){ continue; }
  const chars = await svc.getCharacteristics();
  const n = chars.find(c=>c.properties.notify||c.properties.indicate);
  const w = chars.find(c=>c.properties.write||c.properties.writeWithoutResponse);
  if(n && w){ nChar=n; wChar=w; log('サービス '+u); break; }
 }
 if(!nChar) throw new Error('OBD2用の通信口が見つかりません（Bluetooth Classic専用の機種の可能性）');
 await nChar.startNotifications();
 const dec = new TextDecoder();
 nChar.addEventListener('characteristicvaluechanged', e=>onData(dec.decode(e.target.value)));
 device.addEventListener('gattserverdisconnected', ()=>{ running=false; setStatus('切断されました','err'); updateButtons(false); });
 const enc = new TextEncoder();
 return {
  name: device.name || 'OBD2',
  async write(s){
   const data = enc.encode(s);
   for(let i=0;i<data.length;i+=20){
    const chunk = data.slice(i,i+20);
    if(wChar.properties.writeWithoutResponse && wChar.writeValueWithoutResponse) await wChar.writeValueWithoutResponse(chunk);
    else await wChar.writeValue(chunk);
   }
  },
  close(){ try{ device.gatt.disconnect(); }catch(e){} }
 };
}

// ===== デモ（車がなくても動作確認できる擬似ELM327） =====
function demoTransport(){
 const t0 = Date.now();
 const h = (v,n=1)=>Math.max(0,Math.round(v)).toString(16).toUpperCase().padStart(n*2,'0').slice(-n*2);
 return {
  name:'デモ',
  async write(s){
   const c = s.trim().toUpperCase(); const t=(Date.now()-t0)/1000;
   const rpm = 800 + 1400*(1+Math.sin(t/4)) + Math.random()*80;
   const spd = Math.max(0, 30 + 25*Math.sin(t/4 - .5));
   let r = '?';
   if(c.startsWith('AT')) r = c==='ATRV' ? (13.9+Math.random()*.4).toFixed(1)+'V' : c==='ATDPN' ? 'A6' : c==='ATZ' ? 'ELM327 v1.5' : 'OK';
   else if(c==='0100') r = '4100BE3EB813';
   else if(c==='010C') r = '410C'+h(rpm*4,2);
   else if(c==='010D') r = '410D'+h(spd);
   else if(c==='0105') r = '4105'+h(Math.min(88, 40+t*2)+40);
   else if(c==='010F') r = '410F'+h(28+40);
   else if(c==='0104') r = '4104'+h((20+rpm/80)*2.55);
   else if(c==='0111') r = '4111'+h((14+Math.max(0,Math.sin(t/4))*30)*2.55);
   else if(c==='010B') r = '410B'+h(35+rpm/60);
   else if(c==='0106') r = '4106'+h(128+(Math.random()-.5)*8);
   else if(c==='0107') r = '4107'+h(131);
   else if(c==='03') r = '4301013300';
   else r = 'NO DATA';
   setTimeout(()=>onData(r+'\r\r>'), 40);
  },
  close(){}
 };
}

// ===== 初期化と計測ループ =====
async function initElm(){
 await cmd('ATZ', 6000);
 for(const c of ['ATE0','ATL0','ATS0','ATH0','ATAT1','ATSP0']) await cmd(c);
 setStatus('車両と通信中…');
 const r = await cmd('0100', 12000);
 const b = parsePid(r,'00');
 if(!b){ throw new Error('車から応答がありません。エンジン（またはACC）をONにしてください'); }
 supported = new Set();
 const mask = ((b[0]<<24)>>>0) + (b[1]<<16) + (b[2]<<8) + b[3];
 for(let n=1;n<=32;n++) if(mask & (1<<(32-n))) supported.add(n.toString(16).toUpperCase().padStart(2,'0'));
 PIDS.forEach(p=>{ if(!supported.has(p.id)) $('t_'+p.key).classList.add('na'); });
 const dp = (await cmd('ATDPN')).replace(/[^0-9A-F]/gi,'').toUpperCase();
 const num = dp.replace(/^A/,'');
 protocol = dp; isCAN = /^[6-9A-C]$/.test(num);
 $('meta').textContent = `アダプター: ${transport.name} / 通信方式: ${num||'?'}${isCAN?'（CAN）':''}`;
}
async function loop(){
 while(running){
  const row = {time:new Date()};
  for(const p of PIDS){
   if(!running) break;
   if(!supported.has(p.id)) continue;
   const b = parsePid(await cmd('01'+p.id), p.id);
   const v = b ? p.f(b[0], b[1]) : null;
   show(p, v); row[p.key] = v;
  }
  if(!running) break;
  const vr = (await cmd('ATRV')).match(/(\d+(\.\d+)?)\s*V/i);
  const vv = vr ? parseFloat(vr[1]) : null; show(VOLT, vv); row.volt = vv;
  samples.push(row); if(samples.length>3600) samples.shift();
  $('meta').textContent = $('meta').textContent.split(' / 記録')[0] + ` / 記録 ${samples.length}件`;
 }
}
async function start(kind){
 try{
  transport = kind==='demo' ? demoTransport() : await bleTransport();
  samples=[]; latest={}; lastDtc=null; startTime=new Date(); $('dtcOut').innerHTML='';
  buildGrid(); updateButtons(true); setStatus('初期化中…');
  await initElm();
  running = true; setStatus(kind==='demo'?'デモ実行中':'接続中','on');
  try{ await navigator.wakeLock?.request('screen'); }catch(e){}
  loop();
 }catch(e){
  log('エラー: '+(e.message||e));
  setStatus(e.name==='NotFoundError'?'キャンセル':'エラー','err');
  if(e.name!=='NotFoundError') toast(e.message||'接続できませんでした');
  stop();
 }
}
function stop(){
 running=false; if(transport) transport.close();
 updateButtons(false);
 if($('status').textContent.includes('中')) setStatus('停止');
}
function updateButtons(on){
 $('btnConnect').disabled=on; $('btnDemo').disabled=on; $('btnStop').disabled=!on; $('btnDtc').disabled=!on;
}
async function readDtc(){
 $('dtcOut').textContent = '読み取り中…';
 const codes = parseDtc(await cmd('03', 8000));
 lastDtc = codes;
 $('dtcOut').innerHTML = codes==null ? '読み取れませんでした' :
  codes.length ? '故障コード：'+codes.map(c=>`<span class="code">${c}</span>`).join('') + '<br><small style="color:var(--dim)">「Claude用コピー」で貼り付けると意味を調べられます</small>'
  : '✅ 故障コードはありません';
}

// ===== Claudeに渡す用テキスト =====
function fmt(v,p){ return v==null||isNaN(v) ? '-' : v.toFixed(p.dp); }
function summaryText(){
 if(!samples.length) return null;
 const L=[];
 const mins = ((samples[samples.length-1].time - samples[0].time)/60000).toFixed(1);
 L.push('【スズキ パレットSW OBD2データ】');
 L.push(`取得日時: ${startTime.toLocaleString('ja-JP')}`);
 L.push(`計測時間: 約${mins}分（${samples.length}サンプル） / 通信方式: ${protocol||'-'}`);
 L.push('故障コード: ' + (lastDtc==null ? '未読取' : lastDtc.length ? lastDtc.join(', ') : 'なし'));
 L.push('');
 L.push('項目 | 最新 | 最小 | 平均 | 最大');
 for(const p of ALL){
  const vs = samples.map(s=>s[p.key]).filter(v=>v!=null && !isNaN(v));
  if(!vs.length) continue;
  const avg = vs.reduce((a,b)=>a+b,0)/vs.length;
  L.push(`${p.label}(${p.unit}) | ${fmt(latest[p.key],p)} | ${fmt(Math.min(...vs),p)} | ${fmt(avg,p)} | ${fmt(Math.max(...vs),p)}`);
 }
 L.push('');
 L.push('直近20件:');
 L.push(csvText(samples.slice(-20)));
 L.push('');
 L.push('このデータから車の状態を診断してください。');
 return L.join('\n');
}
function csvText(rows){
 const keys = ALL.filter(p=>rows.some(r=>r[p.key]!=null));
 const head = ['時刻',...keys.map(p=>`${p.label}(${p.unit})`)].join(',');
 return [head, ...rows.map(r=>[r.time.toLocaleTimeString('ja-JP'),...keys.map(p=>fmt(r[p.key],p))].join(','))].join('\n');
}
async function copy(text){
 if(!text){ toast('まだデータがありません'); return; }
 try{ await navigator.clipboard.writeText(text); }
 catch(e){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); ta.remove();
 }
 toast('コピーしました');
}

// ===== ボタン =====
$('btnConnect').onclick = ()=>{
 if(!navigator.bluetooth){ $('warn').hidden=false; toast('Bluefyで開いてください'); return; }
 start('ble');
};
$('btnDemo').onclick = ()=>start('demo');
$('btnStop').onclick = stop;
$('btnDtc').onclick = readDtc;
$('btnCopy').onclick = ()=>copy(summaryText());
$('btnCsv').onclick = ()=>copy(samples.length ? csvText(samples) : null);

if(!navigator.bluetooth) $('warn').hidden = false;
buildGrid();
</script>
</body>
</html>
